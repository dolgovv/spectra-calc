server {
    listen 80;
    root /usr/share/nginx/html;

    # The port inside the container means nothing to visitors, so redirect by path only.
    absolute_redirect off;

    gzip on;
    gzip_http_version 1.0; # the host's nginx proxies over HTTP/1.0 by default
    gzip_types text/css text/javascript application/javascript application/json text/plain text/csv image/svg+xml;

    # Same limit as MAX_UPLOAD_BYTES in back/src/spectra/spectra.controller.ts.
    client_max_body_size 200m;

    # SPA routes. No $uri/ here: public/example is a directory, so /example would get 403, not the app.
    location / {
        try_files $uri /index.html;
    }

    # File names contain a content hash, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://back:3000;
    }

    location /files/ {
        proxy_pass http://back:3000;
    }
}
