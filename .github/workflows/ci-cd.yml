name: CI/CD

# A merge lands on develop as a push, so this one trigger covers merges too.
on:
  push:
    branches: ['**']

permissions:
  contents: read

defaults:
  run:
    shell: bash # set explicitly because only then does it include pipefail

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # same major as back/Dockerfile
          cache: npm
          cache-dependency-path: |
            back/package-lock.json
            front/package-lock.json

      - name: Check the backend
        working-directory: back
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.json
          npm test
          npm run build

      - name: Check the frontend
        working-directory: front
        run: |
          npm ci
          npm run lint
          npx tsc -b
          npm test
          npm run build # .env.production supplies the empty VITE_API_URL
          # Without .env.production Vite bakes in the default from config.ts, and the production
          # site would call localhost in the visitor's browser.
          if grep -rq "localhost:3000" dist/assets/; then
            echo "::error::localhost:3000 in the bundle, check front/.env.production"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: |
            back/dist
            front/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: check
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    concurrency: production
    env:
      IMAGE_TAG: ${{ github.sha }}
      DEPLOY_DIR: /opt/spectra-calc
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: app

      - name: Build images from the artifact
        run: |
          docker build -t "spectra-calc-web:$IMAGE_TAG" front
          docker build -t "spectra-calc-back:$IMAGE_TAG" back

      - name: Smoke-test the images
        run: |
          touch back.env
          trap 'docker compose logs' EXIT
          docker compose up -d --wait
          url=http://localhost:8090
          curl -fsS -o /dev/null "$url/"
          curl -fsS -o /dev/null "$url/example"
          curl -fsS -o /dev/null "$url/example/result.json"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url/api/calculate")" = 400 ]
          cp test_files/input/substrate3*.zip map.zip # curl -F cannot take the comma in the real name
          id=$(curl -fsS -F archive=@map.zip -F from=595 -F to=625 "$url/api/calculate" | jq -re .id)
          curl -fsS -o /dev/null "$url/files/$id/heatmap.png"
          curl -fsS -o /dev/null "$url/files/$id/report.pdf"

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Run the images on the host
        run: |
          ssh "$TARGET" "mkdir -p $DEPLOY_DIR"
          if ! ssh "$TARGET" "test -f $DEPLOY_DIR/back.env"; then
            echo "::error::$DEPLOY_DIR/back.env is missing on the host, see README"
            exit 1
          fi
          scp docker-compose.yml "$TARGET:$DEPLOY_DIR/"
          docker save "spectra-calc-web:$IMAGE_TAG" "spectra-calc-back:$IMAGE_TAG" | gzip | ssh "$TARGET" docker load
          # .env only holds the tag and is rewritten here; the app's settings live in back.env.
          ssh "$TARGET" "cd $DEPLOY_DIR && echo IMAGE_TAG=$IMAGE_TAG > .env && docker compose up -d --wait"
          # Only this app's images: the host may run other projects.
          ssh "$TARGET" "docker image prune -af --filter label=app=spectra-calc --filter until=720h"
