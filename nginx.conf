server {
    listen 80;
    listen [::]:80;
    server_name spectra-calc.ru www.spectra-calc.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://spectra-calc.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl http2;
    server_name www.spectra-calc.ru;

    ssl_certificate /etc/letsencrypt/live/spectra-calc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spectra-calc.ru/privkey.pem;

    return 301 https://spectra-calc.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl http2;
    server_name spectra-calc.ru;

    ssl_certificate /etc/letsencrypt/live/spectra-calc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spectra-calc.ru/privkey.pem;

    # Same limit as MAX_UPLOAD_BYTES in back/src/spectra/spectra.controller.ts.
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
